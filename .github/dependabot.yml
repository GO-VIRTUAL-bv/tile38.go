version: 2
updates:
  # Go modules. Everything here is a test-only dependency — the library itself
  # has none — so these PRs are gated by the integration job, not by whether
  # consumers build them.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    # First match wins: families first, then the catch-all.
    groups:
      go-virtual:
        patterns: ["github.com/GO-VIRTUAL-bv/*"]
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/genproto*"
          - "google.golang.org/protobuf"
          - "github.com/grpc-ecosystem/*"
          - "buf.build/*"
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
      watermill:
        patterns: ["github.com/ThreeDotsLabs/*"]
      testcontainers:
        patterns:
          - "github.com/testcontainers/*"
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
          - "github.com/opencontainers/*"
      franz-go:
        patterns: ["github.com/twmb/*"]
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]

