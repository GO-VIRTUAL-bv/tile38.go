name: Lint and Test

on:
  # No branch filter: a stacked PR targets the branch below it in the stack, not
  # main, and filtering to main left those PRs with no checks at all — which is
  # indistinguishable from passing when it comes time to merge one.
  pull_request:
  push:
    branches:
      - main

# A second push to a PR supersedes the first, and the integration job pulls a
# Tile38 container per run — so cancel the outdated one. Pushes to main are not
# cancelled: those runs are what the ruleset's required checks report on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  make fmt"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: make vet

      # Pinned in .golangci-version, which `make lint` checks the local binary
      # against. On "latest" a new release silently changes what CI enforces, so
      # a clean local run stopped predicting CI — which is how a goconst finding
      # reached main. Bump the file to adopt a new version deliberately.
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      # The integration tests are behind a build tag, so the default run skips
      # them entirely.
      - name: Run golangci-lint (integration tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m --build-tags=integration

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

      # Codecov is not enabled for now: CODECOV_TOKEN is not set on this
      # repository, so this step uploads nothing and `fail_ci_if_error: false`
      # keeps that from failing the build — which is exactly why it went
      # unnoticed. The coverage profile above is still produced and is what
      # `make test` reports locally. Add the secret to turn reporting on; until
      # then a Codecov badge would render "unknown", so the README omits one.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # testcontainers uses the Docker daemon preinstalled on the runner.
      - name: Run integration tests against Tile38
        run: go test -tags=integration -timeout=15m -v ./...

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
